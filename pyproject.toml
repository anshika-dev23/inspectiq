[project]
name = "inspectiq"
version = "0.1.0"
description = "Inspection compliance copilot"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "chromadb>=1.5",
    "langchain>=1.4",
    "langchain-anthropic",
    "langchain-ollama",
    "langchain-text-splitters",
    "pymupdf>=1.26",
    "python-dotenv",
    "rank-bm25",
    "sentence-transformers",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF's SWIG bindings trigger these at import time; harmless.
    "ignore:builtin type (SwigPy|swigvarlink).*:DeprecationWarning",
]
